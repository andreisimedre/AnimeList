query AnimeListQuery($perPage: Int, $page: Int, $status: MediaStatus, $format: MediaFormat) {
  Page(perPage: $perPage, page: $page) {
    pageInfo {
      currentPage
      hasNextPage
    }
    media(status: $status, format: $format) {
    ...AnimeDetails
    }
  }
}

fragment AnimeDetails on Media {
    id
    averageScore
    siteUrl
    title {
    english
    native
    }
    description
    bannerImage
    coverImage {
    large
    }
}



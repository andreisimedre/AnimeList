query AnimeListQuery($perPage: Int) {
  Page(perPage: $perPage) {
    pageInfo {
      currentPage
      hasNextPage
    }
    ...AnimeDetails
  }
}

fragment AnimeDetails on Page {
  media {
      siteUrl
      title {
        english
        native
      }
      description
      bannerImage
      coverImage {
        large
      }
    }
}


